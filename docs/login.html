<!DOCTYPE html>
<html lang="zxx">

<head>
    <!-- Meta Tags -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- SEO Meta Tags -->
    <meta name="description"
        content="KredimGeldi ile tek tıkla birçok bankaya kredi başvurusu yapın! Hızlı, güvenli ve kolay kredi başvurusu için hemen deneyin.">
    <meta name="keywords"
        content="kredi başvurusu, kredi karşılaştırma, en uygun kredi, hızlı kredi, banka kredileri, kredi hesaplama">
    <meta name="author" content="KredimGeldi">
    <meta name="robots" content="index, follow">
    <meta name="revisit-after" content="7 days">

    <!-- Open Graph Meta Tags (Facebook & LinkedIn) -->
    <meta property="og:title" content="KredimGeldi - Tek Tıkla Kredi Başvurusu">
    <meta property="og:description"
        content="Birden fazla bankaya tek tıkla kredi başvurusu yapın. En uygun kredi seçeneklerini keşfedin!">
    <meta property="og:image" content="https://www.kredimgeldi.com/assets/images/preview.jpg">
    <meta property="og:url" content="https://www.kredimgeldi.com">
    <meta property="og:type" content="website">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="KredimGeldi - Tek Tıkla Kredi Başvurusu">
    <meta name="twitter:description" content="KredimGeldi ile hızlı ve kolay kredi başvurusu yapın!">
    <meta name="twitter:image" content="https://www.kredimgeldi.com/assets/images/preview.jpg">
    <meta name="twitter:site" content="@KredimGeldi">

    <!-- Essential CSS Files -->
    <link rel="stylesheet" href="assets/css/swiper-bundle.min.css">
    <link rel="stylesheet" href="assets/css/flaticon_finto.css">
    <link rel="stylesheet" href="assets/css/scrollCue.css">
    <link rel="stylesheet" href="assets/css/remixicon.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">

    <!-- Title & Favicon -->
    <title>KredimGeldi</title>
    <!-- some good looking meta tags for SEO and preview -->

    <link rel="icon" type="image/png" href="assets/images/favicon.png">
</head>

<body>
    <!-- Start Preloader Area -->
    <div class="preloader-area text-center position-fixed top-0 bottom-0 start-0 end-0" id="preloader">
        <div class="loader position-absolute start-0 end-0">
            <img src="assets/images/favicon.png" alt="favicon" class="img-fluid" style="width: 70px; height: 70px;">
            <div class="wavy position-relative fw-light">
                <span class="d-inline-block"></span>
                <span class="d-inline-block">K</span>
                <span class="d-inline-block">R</span>
                <span class="d-inline-block">E</span>
                <span class="d-inline-block">D</span>
                <span class="d-inline-block">I</span>
                <span class="d-inline-block">M</span>
                <span class="d-inline-block">G</span>
                <span class="d-inline-block">E</span>
                <span class="d-inline-block">L</span>
                <span class="d-inline-block">D</span>
                <span class="d-inline-block">I</span>
            </div>
        </div>
    </div>
    <!-- End Preloader Area -->

    <div id="header-placeholder"></div>
    <!-- End Navbar Area -->
    <div class="mobile-navbar offcanvas offcanvas-end border-0" data-bs-backdrop="static" tabindex="-1"
        id="navbarOffcanvas">

    </div>


    <!-- Search Modal -->
    <div class="search-modal modal fade" id="exampleModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header position-relative">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"> </button>
                </div>
                <div class="modal-body">
                    <form class="popup-form">
                        <input type="text" class="form-control" placeholder="Search here">
                        <button type="submit" class="popup-btn">
                            <i class="ri-search-line"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <!-- End Search Modal -->



    <div class="my-account-page ptb-120 overflow-hidden">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-6 col-md-12" data-cues="slideInRight" data-duration="200">
                    <form class="login-form bg-color-fffaeb radius-30">
                        <h3>Giriş Yap</h3>
                        <input type="text" class="form-control" placeholder="E-Posta">
                        <input type="text" class="form-control" placeholder="Şifre">

                        <div class="d-flex login-warp gap-4 align-items-center justify-content-between">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="flexRadioDefault"
                                    id="flexRadioDefault1">
                                <label class="form-check-label" for="flexRadioDefault1">
                                    Beni Hatırla
                                </label>
                            </div>
                            <div>
                                <a href="password.html" class="password">Şifreni mi unuttun?</a>
                            </div>
                        </div>

                        <button type="submit" class="default-btn w-100 text-center">Giriş Yap</button>

                        <div class="underline position-relative"><span>VEYA</span></div>

                        <a href="https://www.facebook.com/" target="_blank"
                            class="default-btn facebook w-100 text-center mb-4">Facebook ile Giriş Yap</a>
                        <a href="https://www.google.com/" target="_blank"
                            class="default-btn facebook google w-100 text-center mb-4">Google ile Giriş Yap</a>

                        <p>Hesabın mı yok? <a href="login.html">Kayıt Ol</a></p>

                    </form>
                </div>
                <div class="col-lg-6 col-md-12" data-cues="slideInLeft" data-duration="200">
                    <form class="login-form bg-color-fffaeb radius-30">
                        <h3>Hesap Oluştur</h3>
                        <input type="text" class="form-control" placeholder="İsim">
                        <input type="text" class="form-control" placeholder="E-Posta">
                        <input type="text" class="form-control" placeholder="Şifre">
                        <input type="text" class="form-control" placeholder="Şifre Tekrar">
                        <button type="submit" class="default-btn w-100 text-center mb-4">Kayıt Ol</button>
                        <p>Zaten hesabın var mı <a href="login.html">Giriş Yap</a></p>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div id="footer-placeholder" class="footer-area bg-color-0c3a30 pt-120">
    </div>
    <div class="go-top">
        <i class="ri-arrow-up-fill"></i>
    </div>
    <script>
        fetch('components/mobile_navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbarOffcanvas').innerHTML = data;
            });





        fetch('components/footer.html')
            .then(response => response.text())
            .then(data => {
                // document.getElementById('footer-area') add as a scildren
                document.getElementById('footer-placeholder').innerHTML = data;
            });
    </script>
    <style>
        .main-navbar {
            box-shadow: 0px 0px 20px 0px rgba(0, 0, 0, 0.1);
            position: absolute;
            width: 100%;
        }

        .my-account-page{
            padding-top:180px;
        }



    </style>

    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/swiper-bundle.min.js"></script>
    <script src="assets/js/fslightbox.min.js"></script>
    <script src="assets/js/smooth-scroll.js"></script>
    <script src="assets/js/scrollCue.min.js"></script>
    <script src="assets/js/script.js"></script>
</body>

</html>
